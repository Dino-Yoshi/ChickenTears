# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Optional: set this to a Prism Launcher instance's minecraft directory, or pass
# -PprismRunDir=/absolute/path/to/instance/minecraft on the Gradle command line.
# prismRunDir=/absolute/path/to/PrismLauncher/instances/example/minecraft

# Optional: set this to a Prism Launcher instance's mods directory, or pass
# -PprismModsDir=/absolute/path/to/instance/minecraft/mods on the Gradle command line.
# prismModsDir=/absolute/path/to/PrismLauncher/instances/example/minecraft/mods
